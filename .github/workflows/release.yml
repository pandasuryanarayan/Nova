name: Build & Publish Nova Browser Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    name: Build Signed Release APK (v6.6.0)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build Signed Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          ./gradlew :app:assembleRelease || gradle :app:assembleRelease
          mkdir -p releases/v6.6.0
          cp app/build/outputs/apk/release/app-release.apk releases/v6.6.0/NovaBrowser-v6.6.0-release.apk
          sha256sum releases/v6.6.0/NovaBrowser-v6.6.0-release.apk > releases/v6.6.0/NovaBrowser-v6.6.0-release.apk.sha256

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaBrowser-v6.6.0-release-apk
          path: |
            releases/v6.6.0/NovaBrowser-v6.6.0-release.apk
            releases/v6.6.0/NovaBrowser-v6.6.0-release.apk.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: releases/v6.6.0/RELEASE_NOTES.md
          files: |
            releases/v6.6.0/NovaBrowser-v6.6.0-release.apk
            releases/v6.6.0/NovaBrowser-v6.6.0-release.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
