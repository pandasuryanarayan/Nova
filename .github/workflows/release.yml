name: Build & Publish Netra Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    name: Build Signed Release APK (v6.9.2)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify or Build Signed Release APK (v6.9.2)
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          mkdir -p releases/v6.9.2
          if [ ! -f "releases/v6.9.2/Netra-v6.9.2-release.apk" ]; then
            chmod +x gradlew 2>/dev/null || true
            ./gradlew :app:assembleRelease || gradle :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk releases/v6.9.2/Netra-v6.9.2-release.apk
          fi
          sha256sum releases/v6.9.2/Netra-v6.9.2-release.apk > releases/v6.9.2/Netra-v6.9.2-release.apk.sha256

      - name: Match Release Title & Heading Format
        id: release_meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEFAULT_TITLE="Netra v6.9.2 — Website & YouTube Tab Previews, Background Shield & Direct MP4 Downloader (<1 MB) Signed Release APK"
          V691_NAME=$(gh api "repos/${{ github.repository }}/releases/tags/v6.9.1" --jq '.name // ""' 2>/dev/null || true)
          V691_HEADING=$(gh api "repos/${{ github.repository }}/releases/tags/v6.9.1" --jq '.body // ""' 2>/dev/null | grep -m 1 '^#' || true)

          if [ -n "$V691_NAME" ]; then
            MAPPED_TITLE=$(echo "$V691_NAME" | sed -e 's/6\.9\.1/6.9.2/g' -e 's/versionCode = 16/versionCode = 17/g' -e 's/versionCode 16/versionCode 17/g' -e 's/Build 16/Build 17/g' -e 's/Nova Browser/Netra/g')
            if echo "$MAPPED_TITLE" | grep -qiE 'theme|icon|captcha|lock|orange|stealth|qr scanner'; then
              PREFIX=$(echo "$MAPPED_TITLE" | sed -E 's/([—–:-]).*/\1/')
              MAPPED_TITLE="${PREFIX} Website & YouTube Tab Previews, Background Shield & Direct MP4 Downloader (<1 MB) Signed Release APK"
            fi
            echo "title=$MAPPED_TITLE" >> "$GITHUB_OUTPUT"
          else
            echo "title=$DEFAULT_TITLE" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$V691_HEADING" ]; then
            MAPPED_HEADING=$(echo "$V691_HEADING" | sed -e 's/6\.9\.1/6.9.2/g' -e 's/versionCode = 16/versionCode = 17/g' -e 's/versionCode 16/versionCode 17/g' -e 's/Build 16/Build 17/g' -e 's/Nova Browser/Netra/g')
            if echo "$MAPPED_HEADING" | grep -qiE 'theme|icon|captcha|lock|orange|stealth|qr scanner'; then
              H_PREFIX=$(echo "$MAPPED_HEADING" | sed -E 's/([—–:-]).*/\1/')
              MAPPED_HEADING="${H_PREFIX} Website & YouTube Tab Previews, Background Shield & Direct MP4 Downloader (<1 MB) Signed Release APK"
            fi
            sed -i "1s|^#.*|${MAPPED_HEADING}|" releases/v6.9.2/RELEASE_NOTES.md
          fi

      - name: Create & Push Git Tag v6.9.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v6.9.2 -m "${{ steps.release_meta.outputs.title }}" -f
          git push origin refs/tags/v6.9.2 --force

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Netra-v6.9.2-release-apk
          path: |
            releases/v6.9.2/Netra-v6.9.2-release.apk
            releases/v6.9.2/Netra-v6.9.2-release.apk.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.9.2
          name: ${{ steps.release_meta.outputs.title }}
          body_path: releases/v6.9.2/RELEASE_NOTES.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            releases/v6.9.2/Netra-v6.9.2-release.apk
            releases/v6.9.2/Netra-v6.9.2-release.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
