name: Publish GitHub Release (v6.4.0 APK)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release-apk:
    name: Create GitHub Release v6.4.0 & Attach Signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Signed Release APK v6.4.0
        run: |
          ls -lh releases/v6.4.0/NovaBrowser-v6.4.0-release.apk
          sha256sum releases/v6.4.0/NovaBrowser-v6.4.0-release.apk

      - name: Create or Update GitHub Release v6.4.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.4.0
          name: "Nova Browser v6.4.0 (Signed Release APK)"
          body_path: releases/v6.4.0/RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            releases/v6.4.0/NovaBrowser-v6.4.0-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
