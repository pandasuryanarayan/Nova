name: Build & Publish Netra Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    name: Build Signed Release APK (v6.9.8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify or Build Signed Release APK (v6.9.8)
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          mkdir -p releases/v6.9.8
          if [ ! -f "releases/v6.9.8/Netra-v6.9.8-release.apk" ]; then
            ./gradlew :app:assembleRelease || gradle :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk releases/v6.9.8/Netra-v6.9.8-release.apk
          fi
          sha256sum releases/v6.9.8/Netra-v6.9.8-release.apk > releases/v6.9.8/Netra-v6.9.8-release.apk.sha256

      - name: Match Release Title & Heading Format
        id: release_meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEFAULT_TITLE="Netra v6.9.8 — Full Android Browser Category & Default Browser Role Recognition"
          echo "title=$DEFAULT_TITLE" >> "$GITHUB_OUTPUT"

      - name: Create & Push Git Tag v6.9.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v6.9.8 -m "${{ steps.release_meta.outputs.title }}" -f
          git push origin refs/tags/v6.9.8 --force

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Netra-v6.9.8-release-apk
          path: |
            releases/v6.9.8/Netra-v6.9.8-release.apk
            releases/v6.9.8/Netra-v6.9.8-release.apk.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.9.8
          name: ${{ steps.release_meta.outputs.title }}
          body_path: releases/v6.9.8/RELEASE_NOTES.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            releases/v6.9.8/Netra-v6.9.8-release.apk
            releases/v6.9.8/Netra-v6.9.8-release.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
