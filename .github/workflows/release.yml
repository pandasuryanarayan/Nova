name: Build & Publish Nova Browser Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    name: Build Signed Release APK (v6.8.0)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify or Build Signed Release APK (v6.8.0)
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          mkdir -p releases/v6.8.0
          if [ ! -f "releases/v6.8.0/NovaBrowser-v6.8.0-release.apk" ]; then
            ./gradlew :app:assembleRelease || gradle :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk releases/v6.8.0/NovaBrowser-v6.8.0-release.apk
          fi
          sha256sum releases/v6.8.0/NovaBrowser-v6.8.0-release.apk > releases/v6.8.0/NovaBrowser-v6.8.0-release.apk.sha256

      - name: Match v6.5.0 Release Title & Heading Format
        id: release_meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEFAULT_TITLE="Nova Browser v6.8.0 — Redesigned UI, QR Scanner, Real Website Icons & Ultra-Light (<1.5 MB) Signed Release APK"
          V650_NAME=$(gh api "repos/${{ github.repository }}/releases/tags/v6.5.0" --jq '.name // ""' 2>/dev/null || true)
          V650_HEADING=$(gh api "repos/${{ github.repository }}/releases/tags/v6.5.0" --jq '.body // ""' 2>/dev/null | grep -m 1 '^#' || true)

          if [ -n "$V650_NAME" ]; then
            MAPPED_TITLE=$(echo "$V650_NAME" | sed -e 's/6\.5\.0/6.8.0/g' -e 's/versionCode = 11/versionCode = 14/g' -e 's/versionCode 11/versionCode 14/g' -e 's/Build 11/Build 14/g')
            if echo "$MAPPED_TITLE" | grep -qiE 'theme|icon|captcha|lock|orange|stealth'; then
              PREFIX=$(echo "$MAPPED_TITLE" | sed -E 's/([—–:-]).*/\1/')
              MAPPED_TITLE="${PREFIX} Redesigned UI, QR Scanner, Real Website Icons & Ultra-Light (<1.5 MB) Signed Release APK"
            fi
            echo "title=$MAPPED_TITLE" >> "$GITHUB_OUTPUT"
          else
            echo "title=$DEFAULT_TITLE" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$V650_HEADING" ]; then
            MAPPED_HEADING=$(echo "$V650_HEADING" | sed -e 's/6\.5\.0/6.8.0/g' -e 's/versionCode = 11/versionCode = 14/g' -e 's/versionCode 11/versionCode 14/g' -e 's/Build 11/Build 14/g')
            if echo "$MAPPED_HEADING" | grep -qiE 'theme|icon|captcha|lock|orange|stealth'; then
              H_PREFIX=$(echo "$MAPPED_HEADING" | sed -E 's/([—–:-]).*/\1/')
              MAPPED_HEADING="${H_PREFIX} Redesigned UI, QR Scanner, Real Website Icons & Ultra-Light (<1.5 MB) Signed Release APK"
            fi
            sed -i "1s|^#.*|${MAPPED_HEADING}|" releases/v6.8.0/RELEASE_NOTES.md
          fi

      - name: Create & Push Git Tag v6.8.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v6.8.0 -m "${{ steps.release_meta.outputs.title }}" -f
          git push origin refs/tags/v6.8.0 --force

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaBrowser-v6.8.0-release-apk
          path: |
            releases/v6.8.0/NovaBrowser-v6.8.0-release.apk
            releases/v6.8.0/NovaBrowser-v6.8.0-release.apk.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.8.0
          name: ${{ steps.release_meta.outputs.title }}
          body_path: releases/v6.8.0/RELEASE_NOTES.md
          draft: false
          prerelease: false
          make_latest: true
          files: |
            releases/v6.8.0/NovaBrowser-v6.8.0-release.apk
            releases/v6.8.0/NovaBrowser-v6.8.0-release.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
